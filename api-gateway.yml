server:
  port: 8081

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/users/**

        - id: startup-service
          uri: lb://startup-service
          predicates:
            - Path=/startups/**

        - id: investment-service
          uri: lb://investment-service
          predicates:
            - Path=/investments/**

        - id: team-service
          uri: lb://team-service
          predicates:
            - Path=/teams/**

        - id: messaging-service
          uri: lb://messaging-service
          predicates:
            - Path=/messages/**

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/notifications/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
